<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collexa</title>
    <meta name="description" content="University Event Management Platform" />
    <meta name="author" content="Collexa" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />

    <meta property="og:title" content="Collexa" />
    <meta property="og:description" content="Collexa — discover, register for, and organize campus events, teams, and student activities in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://campus-connect-f1f29.web.app/favicon.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://campus-connect-f1f29.web.app/favicon.jpg" />
  </head>

  <body>
    <script>
      // Apply persisted theme before first paint (default: dark, the app's
      // original look). Kept in sync with src/pages/Settings.tsx.
      (function () {
        try {
          var theme = localStorage.getItem('collexa-theme') || 'dark';
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
